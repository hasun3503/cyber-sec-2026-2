{% extends "base.html" %}
{% block title %}로그인 - 보안 실습 상점{% endblock %}
{% block content %}
<!-- 로그인 카드 영역입니다. -->
<section class="card narrow">
    <h1>로그인</h1>
    <!-- 영상과 실습에서 사용할 기본 계정을 안내합니다. -->
    <p class="hint">실습 계정: <code>student</code> / <code>password123</code></p>
    <!-- 입력한 값을 POST 방식으로 현재 /login 주소에 전송합니다. -->
    <form method="post">
        <!-- 아이디 입력창의 설명입니다. -->
        <label for="username">아이디</label>
        <!-- name 값은 Flask의 request.form에서 사용할 키입니다. -->
        <input id="username" name="username" required autocomplete="username">

        <!-- 비밀번호 입력창의 설명입니다. -->
        <label for="password">비밀번호</label>
        <!-- type=password는 입력 글자를 화면에서 가립니다. -->
        <input id="password" name="password" type="password" required autocomplete="current-password">

        <!-- 폼을 서버로 제출하는 버튼입니다. -->
        <button type="submit">로그인</button>
    </form>
</section>
{% endblock %}
